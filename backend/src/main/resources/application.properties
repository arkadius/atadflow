# Datasource
quarkus.datasource.db-kind=postgresql
%dev.quarkus.datasource.username=atadflow
%dev.quarkus.datasource.password=atadflow
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/atadflow
%prod.quarkus.datasource.username=atadflow
%prod.quarkus.datasource.password=atadflow
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/atadflow

# Hibernate
quarkus.hibernate-orm.database.generation=none

# Flyway
quarkus.flyway.migrate-at-start=true

# CORS (dev)
quarkus.http.cors.origins=http://localhost:5173
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=Content-Type,Authorization

# Swagger UI
quarkus.swagger-ui.always-include=true

# Test — Dev Services auto-starts a PostgreSQL testcontainer
%test.quarkus.flyway.clean-at-start=true
