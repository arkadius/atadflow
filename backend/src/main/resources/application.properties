# Datasource
quarkus.datasource.db-kind=postgresql
%dev.quarkus.datasource.username=atadflow
%dev.quarkus.datasource.password=atadflow
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/atadflow

# Hibernate
quarkus.hibernate-orm.database.generation=none

# Flyway
quarkus.flyway.migrate-at-start=true

# CORS (dev only - frontend served from backend in production)
%dev.quarkus.http.cors.origins=http://localhost:5173
%dev.quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
%dev.quarkus.http.cors.headers=Content-Type,Authorization

# Swagger UI
quarkus.swagger-ui.always-include=true

# Test — Dev Services auto-starts a PostgreSQL testcontainer
%test.quarkus.flyway.clean-at-start=true

# Spark Connect
spark.connect.url=sc://localhost:15002

# Python
python.executable=${PYTHON_EXECUTABLE:venv/bin/python3}
%test.python.executable=/usr/bin/python3

# Production Docker configuration
%prod.quarkus.datasource.username=atadflow
%prod.quarkus.datasource.password=atadflow
%prod.quarkus.datasource.jdbc.url=${DATABASE_URL:jdbc:postgresql://postgres:5432/atadflow}
%prod.python.executable=python3
%prod.spark.connect.url=${SPARK_CONNECT_URL:sc://spark-connect:15002}
