# Default values for atadflow.
# This file is intended for reasonable defaults.
# Do NOT set passwords here - use --set or external secrets

replicaCount: 1

image:
  repository: atadflow/atadflow
  tag: "1.2.0"
  pullPolicy: IfNotPresent
  pullSecrets: []

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: false
  name: ""

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: atadflow.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

postgresql:
  enabled: true
  auth:
    username: atadflow
    database: atadflow
    # Password must be set via --set postgresql.auth.password=xxx or external secrets
    # password: ""
  primary:
    persistence:
      enabled: true
      size: 8Gi
      storageClass: ""
    resources:
      requests:
        memory: "256Mi"
        cpu: "250m"
      limits:
        memory: "512Mi"
        cpu: "500m"

spark:
  # External Spark Connect URL
  # Set to empty if Spark Connect should be deployed separately
  connectUrl: "sc://spark-connect:15002"

# Application container resources
resources:
  limits:
    memory: "2Gi"
    cpu: "1000m"
  requests:
    memory: "1Gi"
    cpu: "500m"

# Pod security context
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

# Container security context
securityContext:
  capabilities:
    drop:
      - ALL
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true

# Node selector, tolerations, and affinity
nodeSelector: {}

tolerations: []

affinity: {}

# Liveness and readiness probe configuration
livenessProbe:
  initialDelaySeconds: 60
  periodSeconds: 15
  timeoutSeconds: 3
  failureThreshold: 5

readinessProbe:
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3
