apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "atadflow.fullname" . }}-test-connection"
  labels:
    {{- include "atadflow.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  activeDeadlineSeconds: 60
  restartPolicy: Never
  containers:
    - name: wget
      image: busybox:1.36
      command:
        - wget
        - "-q"
        - "-O-"
        - "http://{{ include "atadflow.fullname" . }}:{{ .Values.service.port }}/q/health/live"
      resources:
        requests:
          memory: "16Mi"
          cpu: "10m"
        limits:
          memory: "32Mi"
          cpu: "100m"
